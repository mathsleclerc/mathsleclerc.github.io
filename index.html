<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maths avec M. Leclerc</title>
  <meta name="description" content="Le site des élèves de M. Leclerc : cours, fiches d'exercices, exerciseurs corrigés en ligne et vidéos de mathématiques pour le collège.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Maths avec M. Leclerc">
  <meta property="og:description" content="Cours, fiches d'exercices, exerciseurs corrigés en ligne et vidéos de mathématiques pour le collège.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="accueil">
  <header class="bandeau">
    <div class="interieur">
      <p class="surtitre" id="presentation"></p>
      <h1 id="titre"></h1>
      <p id="sous-titre"></p>
    </div>
  </header>

  <main id="contenu">
    <noscript><p class="vide-niveau">Active JavaScript dans ton navigateur pour afficher les cours et les exercices.</p></noscript>

    <section class="section-accueil" aria-labelledby="t-niveaux">
      <h2 class="onglet" id="t-niveaux"><span>Les niveaux</span></h2>
      <p class="intro" id="message"></p>
      <div class="grille-niveaux" id="grille"></div>
    </section>

    <section class="section-accueil" aria-labelledby="t-recherche">
      <h2 class="onglet" id="t-recherche"><span>Chercher dans tout le site</span></h2>
      <input class="recherche" id="recherche-globale" type="search" placeholder="Par exemple : fraction, Pythagore…" aria-label="Chercher un chapitre, un cours, une fiche ou une vidéo dans tous les niveaux" autocomplete="off">
      <div id="resultats" aria-live="polite"></div>
    </section>

    <section class="section-accueil" aria-labelledby="t-mode">
      <h2 class="onglet" id="t-mode"><span>Comment utiliser ce site</span></h2>
      <ul class="mode-emploi" id="mode-emploi"></ul>
    </section>
  </main>

  <footer id="pied"></footer>

  <script src="contenu.js"></script>
  <script src="app.js"></script>
  <script>pageAccueil();</script>
</body>
</html>
