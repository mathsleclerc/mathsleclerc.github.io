<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Résolution de problèmes — Équivalences — Activité 6e</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../style.css">
  <link rel="stylesheet" href="../../../exerciseurs/exerciseurs.css">
  <link rel="stylesheet" href="equivalences.css">
</head>
<body>
  <header class="bandeau">
    <div class="interieur">
      <div class="fil"><a href="../../../niveau.html?n=6e">← Sixième</a></div>
      <h1>Résolution de problèmes — Équivalences</h1>
      <p>Activité · Deux plateaux s'équilibrent, deux paniers ont le même prix : retrouve ce que vaut chaque objet</p>
    </div>
  </header>

  <main class="eq">
    <nav class="etapes" id="etapes" aria-label="Étapes de l'activité"></nav>

    <section class="mission">
      <h2 id="titre-etape"></h2>
      <p id="texte-mission"></p>
    </section>

    <div class="atelier">
      <div class="zone">
        <div class="zone-tete">
          <span id="numero"></span>
          <span class="pastille">Réussies : <strong id="reussies">0</strong></span>
        </div>
        <p class="consigne" id="consigne"></p>
        <div id="scene"></div>
        <div class="outils" id="outils"></div>
        <div class="coach" id="coach" aria-live="polite"></div>
        <div class="phrases" id="phrases"></div>
        <div class="correction" id="correction" hidden></div>
      </div>
      <aside class="carnet">
        <h3>Carnet de calculs</h3>
        <p class="carnet-aide">Chaque action sur une balance est notée ici. C'est toi qui fais les calculs !</p>
        <ol id="carnet"></ol>
      </aside>
    </div>
  </main>

  <footer id="pied"></footer>

  <script src="../../../contenu.js"></script>
  <script src="../../../app.js"></script>
  <script src="../../../exerciseurs/moteur.js"></script>
  <script src="equivalences.js"></script>
</body>
</html>
